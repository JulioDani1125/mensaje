<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="100%" height="100%">
  <defs>
    <linearGradient id="wineRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a182c"/>
      <stop offset="50%" stop-color="#661021"/>
      <stop offset="100%" stop-color="#4a0815"/>
    </linearGradient>
    <filter id="bowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#30050e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#bowShadow)">
    <!-- Lazos laterales -->
    <path d="M60,25 C45,10 20,12 18,25 C16,36 42,32 60,28 Z" fill="url(#wineRibbon)"/>
    <path d="M60,25 C75,10 100,12 102,25 C104,36 78,32 60,28 Z" fill="url(#wineRibbon)"/>
    <!-- Cintas que cuelgan -->
    <path d="M57,28 Q45,50 38,65 Q45,60 52,58 Q57,45 60,30" fill="url(#wineRibbon)"/>
    <path d="M63,28 Q75,50 82,65 Q75,60 68,58 Q63,45 60,30" fill="url(#wineRibbon)"/>
    <!-- Nudo central -->
    <ellipse cx="60" cy="27" rx="7" ry="6" fill="#520a17"/>
    <ellipse cx="60" cy="27" rx="5" ry="4" fill="none" stroke="#94263c" stroke-width="0.8"/>
  </g>
</svg>

