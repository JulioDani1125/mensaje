<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <filter id="envShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4a0f1d" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="envBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faedf0"/>
    </linearGradient>
    <linearGradient id="envFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#f5dfe4"/>
    </linearGradient>
    <linearGradient id="waxSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1f33"/>
      <stop offset="50%" stop-color="#691223"/>
      <stop offset="100%" stop-color="#4a0915"/>
    </linearGradient>
  </defs>

  <g filter="url(#envShadow)">
    <!-- Cuerpo del sobre -->
    <rect x="20" y="30" width="280" height="180" rx="16" fill="url(#envBody)" stroke="#ebd2d8" stroke-width="1.5"/>
    
    <!-- Pliegues interiores del sobre -->
    <path d="M20,210 L160,115 L300,210" fill="none" stroke="#e6c8cf" stroke-width="1.5"/>
    <path d="M20,30 L130,125" fill="none" stroke="#ecd7dc" stroke-width="1"/>
    <path d="M300,30 L190,125" fill="none" stroke="#ecd7dc" stroke-width="1"/>
    
    <!-- Solapa triangular superior doblada hacia abajo -->
    <polygon points="20,30 300,30 160,135" fill="url(#envFlap)" stroke="#e4c3cb" stroke-width="1.5"/>
    
    <!-- Sello de Cera / Lacre Color Vino -->
    <circle cx="160" cy="135" r="28" fill="url(#waxSeal)"/>
    <circle cx="160" cy="135" r="23" fill="none" stroke="#a33249" stroke-width="1.5" stroke-dasharray="3 2"/>
    
    <!-- Emblema de Lirio / Flor en el sello de cera -->
    <path d="M160,121 C154,127 151,133 160,146 C169,133 166,127 160,121 Z" fill="#f8d5dc" opacity="0.95"/>
    <path d="M160,137 C151,136 144,141 144,146 C152,147 158,142 160,137 Z" fill="#f8d5dc" opacity="0.9"/>
    <path d="M160,137 C169,136 176,141 176,146 C168,147 162,142 160,137 Z" fill="#f8d5dc" opacity="0.9"/>
    <circle cx="160" cy="138" r="2" fill="#d97e93"/>
  </g>
</svg>

