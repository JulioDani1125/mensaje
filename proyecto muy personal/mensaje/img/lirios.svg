<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="petalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#3a0813" flood-opacity="0.35"/>
    </filter>

    <!-- Gradientes de Pétalos Color Vino -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f6"/>
      <stop offset="50%" stop-color="#faeaee"/>
      <stop offset="100%" stop-color="#f0d5dc"/>
    </linearGradient>

    <linearGradient id="petalTop" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4a0d1a"/>
      <stop offset="35%" stop-color="#70182b"/>
      <stop offset="70%" stop-color="#93243c"/>
      <stop offset="100%" stop-color="#bf3d59"/>
    </linearGradient>

    <linearGradient id="petalRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#440a16"/>
      <stop offset="40%" stop-color="#691628"/>
      <stop offset="75%" stop-color="#8a2037"/>
      <stop offset="100%" stop-color="#b63853"/>
    </linearGradient>

    <linearGradient id="petalLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#440a16"/>
      <stop offset="40%" stop-color="#691628"/>
      <stop offset="75%" stop-color="#8a2037"/>
      <stop offset="100%" stop-color="#b63853"/>
    </linearGradient>

    <linearGradient id="petalBottomLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e0e1c"/>
      <stop offset="40%" stop-color="#72192d"/>
      <stop offset="75%" stop-color="#91233a"/>
      <stop offset="100%" stop-color="#ba3955"/>
    </linearGradient>

    <linearGradient id="petalBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e0e1c"/>
      <stop offset="40%" stop-color="#72192d"/>
      <stop offset="75%" stop-color="#91233a"/>
      <stop offset="100%" stop-color="#ba3955"/>
    </linearGradient>

    <linearGradient id="petalBottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#54101e"/>
      <stop offset="45%" stop-color="#781b30"/>
      <stop offset="80%" stop-color="#9b2641"/>
      <stop offset="100%" stop-color="#be3b58"/>
    </linearGradient>

    <!-- Hojas en verde salvia / oliva elegante -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3328"/>
      <stop offset="50%" stop-color="#335242"/>
      <stop offset="100%" stop-color="#4a735e"/>
    </linearGradient>

    <!-- Estambre dorado -->
    <linearGradient id="stamenGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#611a28"/>
      <stop offset="60%" stop-color="#e2aa58"/>
      <stop offset="100%" stop-color="#f5ca79"/>
    </linearGradient>

    <linearGradient id="antherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d48a33"/>
      <stop offset="50%" stop-color="#f3be6c"/>
      <stop offset="100%" stop-color="#944f12"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular estético -->
  <rect width="100%" height="100%" rx="36" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="150" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#e8c4cc" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Hojas estilizadas de fondo -->
  <g id="leaves">
    <!-- Hoja superior izquierda -->
    <path d="M190,190 Q120,110 70,120 Q120,165 190,190 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M190,190 Q130,135 70,120" stroke="#719e86" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Hoja superior derecha -->
    <path d="M210,190 Q290,105 335,115 Q285,160 210,190 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M210,190 Q275,130 335,115" stroke="#719e86" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Hoja inferior derecha -->
    <path d="M205,210 Q285,270 325,320 Q255,295 205,210 Z" fill="url(#leafGrad)" opacity="0.75"/>
    <!-- Hoja inferior izquierda -->
    <path d="M195,210 Q115,270 75,315 Q140,295 195,210 Z" fill="url(#leafGrad)" opacity="0.75"/>
  </g>

  <!-- Pétalos de fondo (capa inferior del lirio) -->
  <g id="backPetals" filter="url(#petalShadow)">
    <!-- Pétalo Arriba-Izquierda -->
    <path d="M200,200 C155,165 105,120 115,65 C145,95 180,150 200,200 Z" fill="url(#petalLeft)"/>
    <path d="M200,200 C160,140 135,90 115,65" stroke="#e0718b" stroke-width="1.2" fill="none" opacity="0.45"/>

    <!-- Pétalo Arriba-Derecha -->
    <path d="M200,200 C245,165 295,120 285,65 C255,95 220,150 200,200 Z" fill="url(#petalRight)"/>
    <path d="M200,200 C240,140 265,90 285,65" stroke="#e0718b" stroke-width="1.2" fill="none" opacity="0.45"/>

    <!-- Pétalo Abajo (Central) -->
    <path d="M200,200 C180,260 170,315 200,355 C230,315 220,260 200,200 Z" fill="url(#petalBottom)"/>
    <path d="M200,200 C200,265 200,315 200,355" stroke="#e0718b" stroke-width="1.2" fill="none" opacity="0.45"/>
  </g>

  <!-- Pétalos frontales (capa principal del lirio con sus curvas emblemáticas) -->
  <g id="frontPetals" filter="url(#petalShadow)">
    <!-- Pétalo Arriba (Central superior) -->
    <path d="M200,200 C180,140 170,80 200,42 C230,80 220,140 200,200 Z" fill="url(#petalTop)"/>
    <path d="M200,200 C200,135 200,85 200,42" stroke="#f08da3" stroke-width="1.4" fill="none" opacity="0.55"/>
    <!-- Nervaduras sutiles -->
    <circle cx="198" cy="140" r="1.5" fill="#3a0712" opacity="0.6"/>
    <circle cx="203" cy="125" r="1.5" fill="#3a0712" opacity="0.6"/>
    <circle cx="197" cy="110" r="1.2" fill="#3a0712" opacity="0.5"/>

    <!-- Pétalo Abajo-Izquierda -->
    <path d="M200,200 C150,225 105,255 75,290 C110,290 160,255 200,200 Z" fill="url(#petalBottomLeft)"/>
    <path d="M200,200 C150,245 110,270 75,290" stroke="#f08da3" stroke-width="1.4" fill="none" opacity="0.55"/>
    <circle cx="150" cy="245" r="1.5" fill="#3a0712" opacity="0.6"/>
    <circle cx="130" cy="260" r="1.5" fill="#3a0712" opacity="0.6"/>

    <!-- Pétalo Abajo-Derecha -->
    <path d="M200,200 C250,225 295,255 325,290 C290,290 240,255 200,200 Z" fill="url(#petalBottomRight)"/>
    <path d="M200,200 C250,245 290,270 325,290" stroke="#f08da3" stroke-width="1.4" fill="none" opacity="0.55"/>
    <circle cx="250" cy="245" r="1.5" fill="#3a0712" opacity="0.6"/>
    <circle cx="270" cy="260" r="1.5" fill="#3a0712" opacity="0.6"/>
  </g>

  <!-- Centro y Garganta de la flor -->
  <circle cx="200" cy="200" r="22" fill="#350610"/>
  <circle cx="200" cy="200" r="14" fill="#24030a"/>

  <!-- Estambres dorados característicos de los lirios -->
  <g id="stamens">
    <!-- Estambre 1 (Arriba izq) -->
    <path d="M200,200 Q180,165 165,145" stroke="url(#stamenGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="163" cy="143" rx="7" ry="3.5" transform="rotate(-35 163 143)" fill="url(#antherGrad)"/>

    <!-- Estambre 2 (Arriba der) -->
    <path d="M200,200 Q220,165 235,145" stroke="url(#stamenGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="237" cy="143" rx="7" ry="3.5" transform="rotate(35 237 143)" fill="url(#antherGrad)"/>

    <!-- Estambre 3 (Derecha) -->
    <path d="M200,200 Q235,195 258,202" stroke="url(#stamenGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="260" cy="202" rx="7" ry="3.5" transform="rotate(15 260 202)" fill="url(#antherGrad)"/>

    <!-- Estambre 4 (Abajo der) -->
    <path d="M200,200 Q225,230 236,252" stroke="url(#stamenGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="237" cy="254" rx="7" ry="3.5" transform="rotate(65 237 254)" fill="url(#antherGrad)"/>

    <!-- Estambre 5 (Abajo izq) -->
    <path d="M200,200 Q175,230 164,252" stroke="url(#stamenGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="163" cy="254" rx="7" ry="3.5" transform="rotate(-65 163 254)" fill="url(#antherGrad)"/>

    <!-- Estambre 6 (Izquierda) -->
    <path d="M200,200 Q165,195 142,202" stroke="url(#stamenGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="140" cy="202" rx="7" ry="3.5" transform="rotate(-15 140 202)" fill="url(#antherGrad)"/>

    <!-- Pistilo Central (Estilo y Estigma) -->
    <path d="M200,200 Q200,180 200,162" stroke="#90c29b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="200" cy="160" r="4.5" fill="#4d7c57"/>
  </g>

  <!-- Destellos y polen flotante -->
  <g id="sparkles">
    <circle cx="180" cy="120" r="1.5" fill="#f7d088" opacity="0.8"/>
    <circle cx="225" cy="115" r="1.8" fill="#f7d088" opacity="0.9"/>
    <circle cx="265" cy="170" r="1.2" fill="#f7d088" opacity="0.7"/>
    <circle cx="135" cy="175" r="1.2" fill="#f7d088" opacity="0.7"/>
    <circle cx="200" cy="275" r="1.5" fill="#f7d088" opacity="0.8"/>
    <polygon points="215,95 218,90 221,95 226,98 221,101 218,106 215,101 210,98" fill="#ffdf99" opacity="0.85"/>
  </g>
</svg>

