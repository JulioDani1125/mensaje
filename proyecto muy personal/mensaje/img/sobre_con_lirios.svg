<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="shadowBig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="shadowSeal" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2a040b" flood-opacity="0.5"/>
    </filter>
    <filter id="softPetal" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3b0a15" flood-opacity="0.25"/>
    </filter>

    <!-- Gradientes del Sobre -->
    <linearGradient id="kraftEnv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f4"/>
      <stop offset="60%" stop-color="#f5e8dd"/>
      <stop offset="100%" stop-color="#e9d6c7"/>
    </linearGradient>

    <linearGradient id="kraftFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7ebd8"/>
      <stop offset="100%" stop-color="#eed8c5"/>
    </linearGradient>

    <linearGradient id="envInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a141b"/>
      <stop offset="100%" stop-color="#481824"/>
    </linearGradient>

    <!-- Gradientes de Lirios (blancos y rosas con centro vino) -->
    <linearGradient id="petalWhite" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#5a0f1d"/>
      <stop offset="30%" stop-color="#c24462"/>
      <stop offset="70%" stop-color="#fcedf1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="petalPink" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#5e0e1e"/>
      <stop offset="35%" stop-color="#b63453"/>
      <stop offset="75%" stop-color="#f594ab"/>
      <stop offset="100%" stop-color="#ffedf2"/>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#223a2a"/>
      <stop offset="60%" stop-color="#3e634a"/>
      <stop offset="100%" stop-color="#5a8c6a"/>
    </linearGradient>

    <linearGradient id="waxSealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80182b"/>
      <stop offset="50%" stop-color="#5c0d1c"/>
      <stop offset="100%" stop-color="#3d0510"/>
    </linearGradient>

    <linearGradient id="antherGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf7f1f"/>
      <stop offset="60%" stop-color="#f5ba4c"/>
      <stop offset="100%" stop-color="#8f4305"/>
    </linearGradient>
  </defs>

  <!-- ================= RAMO DE LIRIOS (Dentro del sobre) ================= -->
  <g id="lilyBouquet" filter="url(#shadowBig)">
    <!-- Hojas de fondo -->
    <g id="bLeaves">
      <path d="M210,280 Q130,170 70,185 Q130,240 210,280 Z" fill="url(#leafGreen)"/>
      <path d="M290,280 Q370,165 430,180 Q370,235 290,280 Z" fill="url(#leafGreen)"/>
      <path d="M250,280 Q250,110 210,70 Q240,140 250,280 Z" fill="url(#leafGreen)"/>
      <path d="M250,280 Q300,120 340,80 Q300,150 250,280 Z" fill="url(#leafGreen)"/>
      <path d="M190,270 Q100,120 140,80 Q160,160 190,270 Z" fill="url(#leafGreen)"/>
      <path d="M310,270 Q400,120 360,80 Q340,160 310,270 Z" fill="url(#leafGreen)"/>
    </g>

    <!-- FLOR 1: Lirio Izquierdo -->
    <g id="flowerLeft" transform="translate(145, 175) rotate(-18) scale(0.72)" filter="url(#softPetal)">
      <path d="M0,0 C-45,-40 -85,-85 -75,-140 C-45,-105 -15,-50 0,0 Z" fill="url(#petalPink)"/>
      <path d="M0,0 C45,-40 85,-85 75,-140 C45,-105 15,-50 0,0 Z" fill="url(#petalPink)"/>
      <path d="M0,0 C-20,60 -30,115 0,155 C30,115 20,60 0,0 Z" fill="url(#petalWhite)"/>
      <path d="M0,0 C-20,-60 -30,-120 0,-160 C30,-120 20,-60 0,0 Z" fill="url(#petalWhite)"/>
      <path d="M0,0 C-50,25 -95,55 -125,90 C-90,90 -40,55 0,0 Z" fill="url(#petalPink)"/>
      <path d="M0,0 C50,25 95,55 125,90 C90,90 40,55 0,0 Z" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="16" fill="#4a0814"/>
      <!-- Estambres -->
      <path d="M0,0 Q-15,-35 -30,-55" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-32" cy="-56" rx="6" ry="3" fill="url(#antherGold)"/>
      <path d="M0,0 Q15,-35 30,-55" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="32" cy="-56" rx="6" ry="3" fill="url(#antherGold)"/>
      <path d="M0,0 Q-30,5 -55,10" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-56" cy="10" rx="6" ry="3" fill="url(#antherGold)"/>
      <path d="M0,0 Q30,5 55,10" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="56" cy="10" rx="6" ry="3" fill="url(#antherGold)"/>
    </g>

    <!-- FLOR 2: Lirio Derecho -->
    <g id="flowerRight" transform="translate(355, 175) rotate(18) scale(0.72)" filter="url(#softPetal)">
      <path d="M0,0 C-45,-40 -85,-85 -75,-140 C-45,-105 -15,-50 0,0 Z" fill="url(#petalWhite)"/>
      <path d="M0,0 C45,-40 85,-85 75,-140 C45,-105 15,-50 0,0 Z" fill="url(#petalPink)"/>
      <path d="M0,0 C-20,60 -30,115 0,155 C30,115 20,60 0,0 Z" fill="url(#petalPink)"/>
      <path d="M0,0 C-20,-60 -30,-120 0,-160 C30,-120 20,-60 0,0 Z" fill="url(#petalWhite)"/>
      <path d="M0,0 C-50,25 -95,55 -125,90 C-90,90 -40,55 0,0 Z" fill="url(#petalPink)"/>
      <path d="M0,0 C50,25 95,55 125,90 C90,90 40,55 0,0 Z" fill="url(#petalWhite)"/>
      <circle cx="0" cy="0" r="16" fill="#4a0814"/>
      <!-- Estambres -->
      <path d="M0,0 Q-15,-35 -30,-55" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-32" cy="-56" rx="6" ry="3" fill="url(#antherGold)"/>
      <path d="M0,0 Q15,-35 30,-55" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="32" cy="-56" rx="6" ry="3" fill="url(#antherGold)"/>
      <path d="M0,0 Q-30,5 -55,10" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-56" cy="10" rx="6" ry="3" fill="url(#antherGold)"/>
      <path d="M0,0 Q30,5 55,10" stroke="#f2b450" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="56" cy="10" rx="6" ry="3" fill="url(#antherGold)"/>
    </g>

    <!-- FLOR 3: Gran Lirio Central Principal (Majestuoso y Grande) -->
    <g id="flowerCenter" transform="translate(250, 155) scale(0.95)" filter="url(#softPetal)">
      <!-- Pétalos traseros -->
      <path d="M0,0 C-55,-50 -105,-105 -90,-165 C-55,-125 -18,-60 0,0 Z" fill="url(#petalWhite)"/>
      <path d="M0,0 C55,-50 105,-105 90,-165 C55,-125 18,-60 0,0 Z" fill="url(#petalWhite)"/>
      <path d="M0,0 C-25,70 -35,135 0,180 C35,135 25,70 0,0 Z" fill="url(#petalPink)"/>

      <!-- Pétalos frontales -->
      <path d="M0,0 C-25,-70 -35,-140 0,-185 C35,-140 25,-70 0,0 Z" fill="url(#petalWhite)"/>
      <path d="M0,0 C-60,30 -115,65 -150,105 C-105,105 -48,65 0,0 Z" fill="url(#petalPink)"/>
      <path d="M0,0 C60,30 115,65 150,105 C105,105 48,65 0,0 Z" fill="url(#petalPink)"/>

      <!-- Garganta vino profunda con pecas -->
      <circle cx="0" cy="0" r="20" fill="#460712"/>
      <circle cx="0" cy="0" r="12" fill="#2d020a"/>
      <circle cx="-5" cy="-60" r="2" fill="#5c0d1c" opacity="0.8"/>
      <circle cx="4" cy="-75" r="2" fill="#5c0d1c" opacity="0.8"/>
      <circle cx="-55" cy="40" r="2" fill="#5c0d1c" opacity="0.8"/>
      <circle cx="55" cy="40" r="2" fill="#5c0d1c" opacity="0.8"/>

      <!-- Estambres dorados -->
      <path d="M0,0 Q-20,-45 -40,-70" stroke="#f5c25e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="-42" cy="-72" rx="8" ry="4" transform="rotate(-30 -42 -72)" fill="url(#antherGold)"/>
      <path d="M0,0 Q20,-45 40,-70" stroke="#f5c25e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="42" cy="-72" rx="8" ry="4" transform="rotate(30 42 -72)" fill="url(#antherGold)"/>
      <path d="M0,0 Q-40,-10 -70,-5" stroke="#f5c25e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="-72" cy="-5" rx="8" ry="4" transform="rotate(-10 -72 -5)" fill="url(#antherGold)"/>
      <path d="M0,0 Q40,-10 70,-5" stroke="#f5c25e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="72" cy="-5" rx="8" ry="4" transform="rotate(10 72 -5)" fill="url(#antherGold)"/>
      <path d="M0,0 Q-25,35 -45,65" stroke="#f5c25e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="-47" cy="-67" rx="8" ry="4" transform="rotate(45 -47 67)" fill="url(#antherGold)"/>
      <path d="M0,0 Q25,35 45,65" stroke="#f5c25e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="47" cy="67" rx="8" ry="4" transform="rotate(-45 47 67)" fill="url(#antherGold)"/>

      <!-- Pistilo -->
      <path d="M0,0 Q0,-60 0,-85" stroke="#96cfa6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-86" r="5" fill="#4d825d"/>
    </g>

    <!-- Destellos de luz ✨ -->
    <polygon points="120,90 123,83 126,90 133,93 126,96 123,103 120,96 113,93" fill="#fce5a6" opacity="0.9"/>
    <polygon points="380,85 383,78 386,85 393,88 386,91 383,98 380,91 373,88" fill="#fce5a6" opacity="0.9"/>
    <polygon points="250,30 253,23 256,30 263,33 256,36 253,43 250,36 243,33" fill="#fce5a6" opacity="0.95"/>
  </g>

  <!-- ================= EL SOBRE (Envelope) ================= -->
  <g id="envelopeFront" filter="url(#shadowBig)">
    <!-- Interior oscuro visible de la abertura -->
    <path d="M70,280 L250,170 L430,280 Z" fill="url(#envInside)"/>

    <!-- Cuerpo principal del sobre (Rectángulo base) -->
    <rect x="70" y="270" width="360" height="230" rx="14" fill="url(#kraftEnv)" stroke="#decbc0" stroke-width="1.5"/>

    <!-- Pliegues laterales del sobre -->
    <!-- Lado Izquierdo -->
    <path d="M70,270 L250,390 L70,500 Z" fill="#ebdacd" stroke="#d6c2b4" stroke-width="1.2"/>
    <!-- Lado Derecho -->
    <path d="M430,270 L250,390 L430,500 Z" fill="#ebdacd" stroke="#d6c2b4" stroke-width="1.2"/>

    <!-- Pliegue inferior del sobre (cubre los laterales abajo) -->
    <path d="M70,500 L250,380 L430,500 Z" fill="url(#kraftFlap)" stroke="#decbc0" stroke-width="1.5"/>

    <!-- Solapa superior doblada con forma de pico hacia el centro -->
    <path d="M70,270 L250,380 L430,270" fill="none" stroke="#d8c5b8" stroke-width="1.8"/>

    <!-- Sello de Cera / Lacre Color Vino -->
    <g id="waxSealGroup" filter="url(#shadowSeal)">
      <!-- Gotas irregulares orgánicas del sello de lacre -->
      <path d="M250,340 C280,340 286,360 284,380 C282,400 270,418 250,418 C230,418 218,400 216,380 C214,360 220,340 250,340 Z" fill="url(#waxSealGrad)"/>
      <circle cx="250" cy="379" r="30" fill="url(#waxSealGrad)"/>
      <!-- Borde interno estampado -->
      <circle cx="250" cy="379" r="23" fill="none" stroke="#9c273e" stroke-width="1.6" stroke-dasharray="3 2"/>
      <!-- Símbolo de flor / Lirio grabado en el sello -->
      <path d="M250,364 C243,371 239,378 250,393 C261,378 257,371 250,364 Z" fill="#f7cfd7" opacity="0.95"/>
      <path d="M250,383 C239,382 230,388 230,394 C240,395 248,389 250,383 Z" fill="#f7cfd7" opacity="0.88"/>
      <path d="M250,383 C261,382 270,388 270,394 C260,395 252,389 250,383 Z" fill="#f7cfd7" opacity="0.88"/>
      <circle cx="250" cy="384" r="2.5" fill="#d47388"/>
    </g>
  </g>
</svg>

